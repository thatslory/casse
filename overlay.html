<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Conta Casse Overlay</title>
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Figtree:wght@700&display=swap">
<style>
/* Overlay per una fonte Browser di OBS: sfondo trasparente, riquadro notte con il numero oro come sulla pagina principale. */
:root {
  --panel: rgba(15, 30, 61, .86);
  --ink: #eff3ff;
  --muted: #b0bedc;
  --gold: #ffc42e;
  --wood: #0f1e3d;
  --band: #34497a;
  --warn: #ff9f8c;
  --display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
  --body: "Figtree", "Segoe UI", system-ui, sans-serif;
}
html, body { margin: 0; background: transparent; overflow: hidden; }
body { padding: 12px; font-family: var(--body); color: var(--ink); }
[hidden] { display: none !important; }
.box {
  display: inline-flex; align-items: center; gap: 18px;
  padding: 14px 24px 14px 16px; border-radius: 18px; background: var(--panel);
}
.box.clear { background: transparent; padding: 0; }
.box.clear .main, .box.clear .lines, .box.clear .label { text-shadow: 0 2px 0 #000, 0 0 10px rgba(0, 0, 0, .85); }
.chest { width: 68px; height: auto; flex: none; }
.chest .wood { fill: var(--wood); stroke: var(--gold); stroke-width: 3; }
.chest .band { fill: var(--band); }
.chest .lock { fill: var(--gold); }
.chest .lid { transform-origin: 12px 44px; transition: transform .16s ease-out; }
.chest.open .lid { transform: rotate(-22deg); }
.count { display: grid; gap: 2px; }
.label { font-size: 15px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.main { font: 400 76px/.95 var(--display); color: var(--gold); font-variant-numeric: tabular-nums; }
.main.pop { animation: pop .35s ease-out; }
@keyframes pop { 40% { transform: scale(1.18); } }
.lines { display: grid; gap: 4px; font-size: 23px; font-variant-numeric: tabular-nums; }
.lines span { color: var(--muted); font-size: 16px; text-transform: uppercase; letter-spacing: .06em; margin-left: 6px; }
.msg { color: var(--warn); font-size: 20px; max-width: 520px; }
</style>
</head>
<body>
<div class="box" id="box">
  <svg class="chest" id="chest" viewBox="0 0 120 92" aria-hidden="true">
    <g class="lid">
      <path class="wood" d="M12 44V30C12 15 23 6 38 6h44c15 0 26 9 26 24v14z"/>
      <rect class="band" x="30" y="8" width="10" height="34"/>
      <rect class="band" x="80" y="8" width="10" height="34"/>
    </g>
    <rect class="wood" x="12" y="48" width="96" height="40" rx="5"/>
    <rect class="band" x="30" y="50" width="10" height="36"/>
    <rect class="band" x="80" y="50" width="10" height="36"/>
    <rect class="lock" x="52" y="40" width="16" height="20" rx="3"/>
  </svg>
  <div class="count">
    <div class="label" id="label">Casse partita</div>
    <div class="main" id="main">–</div>
  </div>
  <div class="lines" id="lines">
    <div id="lTime" hidden>0:00<span>tempo</span></div>
    <div id="lRate" hidden>–<span>all'ora</span></div>
    <div id="lTot" hidden>–<span>totali</span></div>
  </div>
  <div class="msg" id="msg" hidden></div>
</div>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var q = new URLSearchParams(location.hash.slice(1));
  var gid = q.get("g"), tok = q.get("k");
  var show = (q.get("s") || "t,r,tot").split(",");
  var FILE = "conta-casse.json";
  var state = null, etag = null, lastCount = null, timer = null;

  if (q.get("bg") === "0") $("box").classList.add("clear");
  $("lTime").hidden = show.indexOf("t") < 0;
  $("lRate").hidden = show.indexOf("r") < 0;
  $("lTot").hidden = show.indexOf("tot") < 0;

  function whole(v) { return typeof v === "number" && isFinite(v) && v >= 0 ? Math.floor(v) : 0; }
  function fmt(v) { return v.toLocaleString("it-IT", { maximumFractionDigits: 1 }); }
  function clock(ms) {
    var s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), r = s % 60;
    var pad = function (x) { return (x < 10 ? "0" : "") + x; };
    return (h ? h + ":" + pad(m) : m) + ":" + pad(r);
  }
  function setLine(id, text) { $(id).firstChild.nodeValue = text; }
  function message(text) {
    $("msg").textContent = text;
    $("msg").hidden = !text;
  }

  function render() {
    if (!state) return;
    var cur = whole(state.current);
    var matches = Array.isArray(state.matches) ? state.matches : [];
    var tot = matches.reduce(function (a, m) { return a + whole(m && m.n); }, 0) + cur + whole(state.extra);
    var start = cur > 0 ? whole(state.startedAt) : 0;
    var ms = start ? Math.max(0, Date.now() - start) : 0;

    var main = $("main");
    main.textContent = fmt(cur);
    if (lastCount !== null && cur > lastCount) {
      main.classList.remove("pop"); void main.offsetWidth; main.classList.add("pop");
      $("chest").classList.add("open");
      setTimeout(function () { $("chest").classList.remove("open"); }, 260);
    }
    lastCount = cur;

    setLine("lTime", start ? clock(ms) : "0:00");
    var rate = ms >= 60000 ? cur / (ms / 3600000) : null;
    setLine("lRate", rate == null ? "–" : (rate >= 10 ? Math.round(rate).toLocaleString("it-IT") : fmt(rate)));
    setLine("lTot", fmt(tot));
  }

  function next(ms) { clearTimeout(timer); timer = setTimeout(poll, ms); }
  async function poll() {
    try {
      var headers = { Accept: "application/vnd.github+json", Authorization: "Bearer " + tok };
      if (etag) headers["If-None-Match"] = etag;
      var r = await fetch("https://api.github.com/gists/" + encodeURIComponent(gid), { headers: headers, cache: "no-store" });
      var left = Number(r.headers.get("X-RateLimit-Remaining"));
      if (r.status === 304) return next(2000);
      if (r.status === 401 || r.status === 404) {
        message("Link dell'overlay non valido. Copialo di nuovo dalla pagina Conta Casse.");
        return next(60000);
      }
      if (!r.ok) throw new Error(r.status);
      etag = r.headers.get("ETag");
      var j = await r.json();
      var f = j.files && j.files[FILE];
      if (!f) { message("Nessun dato trovato. Collega la sincronizzazione nella pagina Conta Casse."); return next(15000); }
      state = JSON.parse(f.content);
      message("");
      render();
      next(left && left < 100 ? 30000 : 2000);
    } catch (e) {
      next(10000);
    }
  }

  if (!gid || !tok) {
    message("Manca il collegamento. Copia il link dell'overlay dalla pagina Conta Casse.");
  } else {
    poll();
    setInterval(render, 1000);
  }
})();
</script>
</body>
</html>
